name: Android beta
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test optional OAuth broker (no deployment)
        run: node --test oauth-broker/worker.test.mjs
      - name: Compile, test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      # Signing secrets are scoped to trusted main/tag builds, never pull-request code.
      - name: Build signed release when repository signing secrets are configured
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          SONORA_KEYSTORE_BASE64: ${{ secrets.SONORA_KEYSTORE_BASE64 }}
          SONORA_STORE_PASSWORD: ${{ secrets.SONORA_STORE_PASSWORD }}
          SONORA_KEY_ALIAS: ${{ secrets.SONORA_KEY_ALIAS }}
          SONORA_KEY_PASSWORD: ${{ secrets.SONORA_KEY_PASSWORD }}
        run: |
          if [ -z "$SONORA_KEYSTORE_BASE64" ]; then
            echo "Release signing is not configured in Actions. Official signed APKs are on the apk-releases branch."
            exit 0
          fi
          export SONORA_KEYSTORE_PATH="$RUNNER_TEMP/sonora-release.p12"
          trap 'rm -f "$SONORA_KEYSTORE_PATH"' EXIT
          printf '%s' "$SONORA_KEYSTORE_BASE64" | base64 --decode > "$SONORA_KEYSTORE_PATH"
          chmod 600 "$SONORA_KEYSTORE_PATH"
          unset SONORA_KEYSTORE_BASE64
          ./gradlew --no-daemon assembleRelease
          python3 tools/verify-release.py
          mkdir -p signed-dist
          cp app/build/outputs/apk/release/app-release.apk signed-dist/sonora-0.7.2-beta01.apk
          git archive --format=zip --output=signed-dist/sonora-source.zip HEAD
          cp LICENSE NOTICE.md signed-dist/
          cd signed-dist
          sha256sum sonora-0.7.2-beta01.apk > SHA256SUMS
      - name: Upload signed release when built
        if: hashFiles('signed-dist/*.apk') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonora-0.7.2-beta01-signed
          path: signed-dist/
          retention-days: 30
      - name: Package installable debug APK and matching source
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sonora-0.7.2-beta01-debug.apk
          git archive --format=zip --output=dist/sonora-source.zip HEAD
          cp LICENSE NOTICE.md dist/
          cd dist
          sha256sum sonora-0.7.2-beta01-debug.apk > SHA256SUMS
      - name: Upload debug beta
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonora-0.7.2-beta01-debug
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 30
