name: Android beta
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile, test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Package installable debug APK and matching source
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sonora-0.1.0-beta01-debug.apk
          git archive --format=zip --output=dist/sonora-source.zip HEAD
          cp LICENSE NOTICE.md dist/
          cd dist
          sha256sum sonora-0.1.0-beta01-debug.apk > SHA256SUMS
      - name: Upload debug beta
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonora-0.1.0-beta01-debug
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 30
