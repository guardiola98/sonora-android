name: Android beta
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test release publishing guards
        run: python3 -m unittest discover -s tools/tests
      - name: Test optional OAuth broker (no deployment)
        run: node --test oauth-broker/worker.test.mjs
      - name: Verify language resources
        run: python3 tools/verify-translations.py
      - name: Compile, test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - name: Read app version
        id: app
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          version = re.search(r'versionName\s*=\s*"([^"]+)"', Path("app/build.gradle.kts").read_text())[1]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PYTHON
      - name: Package installable debug APK and matching source
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sonora-${{ steps.app.outputs.version }}-debug.apk
          git archive --format=zip --output=dist/sonora-source.zip HEAD
          cp LICENSE NOTICE.md dist/
          cd dist
          sha256sum sonora-${{ steps.app.outputs.version }}-debug.apk > SHA256SUMS
      - name: Upload debug beta
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonora-${{ steps.app.outputs.version }}-debug
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 30
