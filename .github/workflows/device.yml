name: Device playback smoke test
on:
  pull_request:
    paths:
      - '.github/workflows/device.yml'
      - 'app/src/androidTest/java/org/sonora/music/NowPlayingAutoplayTest.kt'
      - 'app/src/androidTest/java/org/sonora/music/Release072DeviceTest.kt'
      - 'app/src/main/java/org/sonora/music/ui/SonoraApp.kt'
      - 'app/src/main/java/org/sonora/music/ui/DiscoveryScreens.kt'
  workflow_dispatch:
    inputs:
      live_youtube:
        description: 'Also test real YouTube playback (network-dependent)'
        type: boolean
        default: false
      live_artists:
        description: 'Also test real artist search and opening songs'
        type: boolean
        default: false
      live_podcasts:
        description: 'Also test real RSS podcast search and playback (network-dependent)'
        type: boolean
        default: false
      live_discovery:
        description: 'Also test real music search, recommendations, radio and metadata'
        type: boolean
        default: false
      startup_benchmark:
        description: 'Measure real startup latency and automatic audio preparation'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            # Capture before connected tests remove their app installation.
            ./gradlew assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class org.sonora.music.NowPlayingAutoplayTest org.sonora.music.test/androidx.test.runner.AndroidJUnitRunner
            mkdir -p now-playing
            adb exec-out run-as org.sonora.music cat files/now-playing-autoplay-on.png > now-playing/now-playing-autoplay-on.png
            adb exec-out run-as org.sonora.music cat files/now-playing-autoplay-off.png > now-playing/now-playing-autoplay-off.png
            test "$(file --mime-type -b now-playing/now-playing-autoplay-on.png)" = image/png
            test "$(file --mime-type -b now-playing/now-playing-autoplay-off.png)" = image/png
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.liveYouTube=${{ inputs.live_youtube }} -Pandroid.testInstrumentationRunnerArguments.liveArtists=${{ inputs.live_artists }} -Pandroid.testInstrumentationRunnerArguments.livePodcasts=${{ inputs.live_podcasts }} -Pandroid.testInstrumentationRunnerArguments.liveDiscovery=${{ inputs.live_discovery }} -Pandroid.testInstrumentationRunnerArguments.startupBenchmark=${{ inputs.startup_benchmark }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            now-playing/
