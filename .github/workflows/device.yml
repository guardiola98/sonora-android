name: Device playback smoke test
on:
  workflow_dispatch:
    inputs:
      live_youtube:
        description: 'Also test real YouTube playback (network-dependent)'
        type: boolean
        default: false
      live_podcasts:
        description: 'Also test real RSS podcast search and playback (network-dependent)'
        type: boolean
        default: false
      live_discovery:
        description: 'Also test real music search, recommendations, radio and metadata'
        type: boolean
        default: false
      startup_benchmark:
        description: 'Measure real startup latency and automatic audio preparation'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.liveYouTube=${{ inputs.live_youtube }} -Pandroid.testInstrumentationRunnerArguments.livePodcasts=${{ inputs.live_podcasts }} -Pandroid.testInstrumentationRunnerArguments.liveDiscovery=${{ inputs.live_discovery }} -Pandroid.testInstrumentationRunnerArguments.startupBenchmark=${{ inputs.startup_benchmark }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
